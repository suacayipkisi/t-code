name: CI

on:
  push:
  pull_request:

# A newer push to the same branch (or PR) cancels the run still going: the newest commit holds the
# earlier ones, and runs no longer queue up behind each other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    # The same container the Fedora packages build in: gcc 14+, GTK4, GtkSourceView 5, VTE, md4c.
    runs-on: ubuntu-24.04
    container: registry.fedoraproject.org/fedora:44
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          dnf -y install make gcc git clangd gdb \
            gtk4-devel gtksourceview5-devel json-glib-devel vte291-gtk4-devel md4c-devel \
            xorg-x11-server-Xvfb dbus-x11 glibc-langpack-en xdotool python3
      - name: Build
        run: make -j"$(nproc)" all
      # Gtk tests need a session bus and headless display; cairo disables the container Vulkan renderer.
      - name: Tests
        run: |
          ulimit -c unlimited
          runtime_dir=$(mktemp -d)
          chmod 700 "$runtime_dir"
          trap 'rm -rf "$runtime_dir"' EXIT
          if ! LANG=en_US.UTF-8 LC_ALL=en_US.UTF-8 XDG_RUNTIME_DIR="$runtime_dir" GSK_RENDERER=cairo \
            dbus-run-session -- xvfb-run -a make -j"$(nproc)" test; then
            core=$(find . -maxdepth 3 -type f -name 'core*' -print -quit)
            if [ -n "$core" ]; then
              gdb --batch -ex 'thread apply all bt full' build/test-lsp "$core"
            else
              LANG=en_US.UTF-8 LC_ALL=en_US.UTF-8 XDG_RUNTIME_DIR="$runtime_dir" GSK_RENDERER=cairo \
                dbus-run-session -- xvfb-run -a gdb --batch -ex run -ex 'thread apply all bt full' --args build/test-lsp
            fi
            exit 1
          fi
      # t-code itself on its own Xvfb, driven by real key presses and clicks; its log must stay empty.
      - name: Real-use scenarios
        run: LANG=en_US.UTF-8 LC_ALL=en_US.UTF-8 GSK_RENDERER=cairo make test-scenarios
  asan:
    # The tests that need no display, leak-strict; -std=c23 wants gcc 14+, like the build above.
    runs-on: ubuntu-24.04
    container: registry.fedoraproject.org/fedora:44
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          dnf -y install make gcc libasan libubsan \
            gtk4-devel gtksourceview5-devel json-glib-devel vte291-gtk4-devel md4c-devel
      - name: Build under ASan
        run: make test-asan
  format:
    runs-on: ubuntu-24.04
    container: registry.fedoraproject.org/fedora:44
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: dnf -y install git clang clang-tools-extra
      # find, not git ls-files: in this container checkout has no .git (git comes after it), and
      # git ls-files printing nothing left clang-format checking no file at all.
      - name: clang-format stays quiet
        run: |
          files=$(find src -name '*.c' -o -name '*.h')
          test -n "$files"
          clang-format --dry-run --Werror $files
