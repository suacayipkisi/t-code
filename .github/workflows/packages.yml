name: Packages

# Packages are built and published for releases (tags like v*), or manually via workflow_dispatch.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  packages:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install package builders and smoke-test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y podman flatpak flatpak-builder jq desktop-file-utils xvfb xauth dbus-x11 squashfs-tools
      - name: Install Snapcraft for core26
        run: sudo snap install snapcraft --classic --channel=9.x/stable
      - name: Build every package and collect release artifacts
        env:
          SNAPCRAFT_BUILD_MODE: destructive
        run: packaging/build.sh
      - name: Package smoke tests
        run: packaging/test.sh
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: packaging/packages/release/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: packages
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: packaging/packages/release/
      - name: Release with the packages
        uses: softprops/action-gh-release@v2
        with:
          files: packaging/packages/release/*
          generate_release_notes: true
